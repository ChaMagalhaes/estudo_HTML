<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Esse é o meu primeiro site!">

    <meta name="keywords" content="site de Charles, primeiro site, programação, html, css, javascript">

    <meta name="author" content="Charles Magalhães">

    <title>Meu Primeiro Site - Charles Magalhães</title>
</head>

<body>
    <h1>
        Elementos de citação
    </h1>

    <!--abbr - tag para palavras abreviadas-->
    <p>Estamos aprendendo <abbr title="Hyper text markup language">HTML</abbr></p>

    <!--address - endereco -->
    <address>
        Rua do exemplo, 123, Centro, Cidade
    </address>

    <!--Cite - citar uma obra-->
    <p>O filme<cite>Titanic</cite></p>

    <!--q - citação de fala -->
    <p>
        O filme<cite>Titanic</cite> com Leonardo de Caprio. Ele disse: <q>Rose meu amor</q>
    </p>

    <!--blockquote - citação do proprio texto-->
    <blockquote>Ela com certeza conseguiria ajudar o jack</blockquote>

    <!--bdo - inverter o texto-->
    <p><bdo dir="rtl">Dimitri</bdo></p>

</body>

</html>
